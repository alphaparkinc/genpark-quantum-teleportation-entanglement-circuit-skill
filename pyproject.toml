[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-quantum-teleportation-entanglement-circuit-skill"
version = "1.0.0"
description = "EPR Bell state generator creating maximally entangled qubit pairs (|Phi+>) for quantum communications and teleportation protocols."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
